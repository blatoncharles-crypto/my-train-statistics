name: Track commute

on:
  schedule:
    # 19:30 UTC Mon-Fri = 20:30 Brussels in winter, 21:30 in summer (after the 17:21 train)
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 track_commute.py
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add data/trips.csv
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Log commute for $(TZ=Europe/Brussels date +%F)"
          git push
