name: Track commute

on:
  schedule:
    # 19:30 UTC Mon-Fri = 20:30 Brussels in winter, 21:30 in summer (after the 17:21 train)
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # "Confirm train" issues for uncertain trips that might be a compensation case

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 track_commute.py
        env:
          CONFIRM_FILE: ${{ runner.temp }}/confirm.tsv
      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add data/trips.csv
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Log commute for $(TZ=Europe/Brussels date +%F)"
          # a correction or check-in saved from the phone may have landed on main meanwhile
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
      - name: Ask to confirm uncertain trips
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_FILE: ${{ runner.temp }}/confirm.tsv
        run: |
          [ -s "$CONFIRM_FILE" ] || { echo "Nothing to confirm"; exit 0; }
          dashboard="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          while IFS=$'\t' read -r action title body; do
            # exact-title match, so an issue is never opened twice (also not after I closed it myself)
            find_issue() { gh issue list --state "$1" --search "\"$title\" in:title" --json number,title \
                       --jq ".[] | select(.title == \"$title\") | .number" | head -1; }
            if [ "$action" = open ] && [ -z "$(find_issue all)" ]; then
              gh issue create --title "$title" --body "$(printf '%b' "$body")

          Dashboard: $dashboard"
            elif [ "$action" = close ] && [ -n "$(find_issue open)" ]; then
              gh issue close "$(find_issue open)" --comment "Resolved: a correction now says which train it was."
            fi
          done < "$CONFIRM_FILE"
