<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pendel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f3f0">
<title>Commute Delays</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f3f0;
    --surface: #fcfcfb;
    --border: #e4e2dc;
    --track: #e9e7e1;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #77756f;
    --series-1: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #111110;
      --surface: #1a1a19;
      --border: #2e2e2b;
      --track: #2e2e2b;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #96958c;
      --series-1: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #111110;
    --surface: #1a1a19;
    --border: #2e2e2b;
    --track: #2e2e2b;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #96958c;
    --series-1: #3987e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    /* keep content clear of the notch / status bar / home indicator when opened from the home screen */
    padding: calc(20px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  header h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 2px 0 18px; color: var(--text-secondary); font-size: 14px; }
  .grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    min-width: 0;
  }
  .span-2 { grid-column: 1 / -1; }
  .label { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; font-weight: 500; }
  .value { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .value small { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; letter-spacing: 0; }
  .sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }

  /* compensation meter */
  .hero { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero span { font-size: 22px; color: var(--text-secondary); font-weight: 500; letter-spacing: 0; }
  .meter { display: flex; gap: 3px; margin: 14px 0 8px; }
  .meter i { flex: 1; height: 12px; border-radius: 4px; background: var(--track); }
  .meter i.on { background: var(--series-1); }

  /* average per train */
  .rows { display: grid; gap: 12px; }
  .row-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .row-head b { font-weight: 600; }
  .row-head .num { font-variant-numeric: tabular-nums; color: var(--text-primary); white-space: nowrap; }
  .row-head .route { color: var(--text-muted); font-size: 13px; }
  .bar { height: 10px; background: var(--track); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }

  /* last trips */
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 500; color: var(--text-secondary); font-size: 12px; padding: 0 6px 8px 0; border-bottom: 1px solid var(--border); }
  td { padding: 9px 6px 9px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td .route { display: block; color: var(--text-muted); font-size: 12px; }
  .r { text-align: right; padding-right: 0; }
  .badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.good { background: var(--good); }
  .dot.warning { background: var(--warning); }
  .dot.critical { background: var(--critical); }

  .muted { color: var(--text-muted); }
  .pending { display: block; color: var(--text-muted); font-size: 12px; font-style: italic; }
  td:first-child { white-space: nowrap; }
  td.r { white-space: nowrap; }
  tr.group td { padding: 12px 0 4px; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
  tr.editable { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  tr.editable:active td { background: var(--track); }
  .hint { font-size: 12px; color: var(--text-muted); margin: -6px 0 8px; }

  /* header gear + bottom sheets */
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .icon-btn { flex: none; width: 40px; height: 40px; margin: -6px -8px 0 0; border: 0; border-radius: 50%; background: transparent;
              color: var(--text-secondary); display: grid; place-items: center; cursor: pointer; }
  .icon-btn:active { background: var(--track); }
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 85vh; overflow-y: auto;
           background: var(--surface); color: var(--text-primary); border-radius: 18px 18px 0 0;
           padding: 8px max(16px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
           max-width: 760px; margin: 0 auto; box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15); }
  .sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 12px; }
  .sheet h3 { font-size: 17px; margin: 0; }
  .sheet .sub { margin: 2px 0 14px; }
  .opts { display: grid; gap: 8px; }
  .opt { width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; cursor: pointer;
         border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; display: flex; justify-content: space-between; gap: 8px; }
  .opt small { color: var(--text-muted); }
  .opt[aria-pressed="true"] { border-color: var(--series-1); box-shadow: inset 0 0 0 1px var(--series-1); }
  .opt:disabled { opacity: 0.5; cursor: default; }
  .trains { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); margin-top: 4px; }
  .trains .opt { padding: 11px 12px; font-variant-numeric: tabular-nums; }
  .field { display: flex; gap: 8px; margin-top: 8px; }
  .field input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 10px;
                 border: 1px solid var(--border); background: var(--page); color: var(--text-primary); }
  .btn { font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 10px; border: 0; cursor: pointer;
         background: var(--series-1); color: #fff; }
  .btn.secondary { background: transparent; color: var(--critical); border: 1px solid var(--border); font-weight: 500; }
  .link { font: inherit; font-size: 14px; color: var(--series-1); background: none; border: 0; padding: 10px 0 0; cursor: pointer; }
  .note { min-height: 1.4em; margin: 12px 0 0; font-size: 14px; }
  .note.ok { color: var(--good); }
  .note.err { color: var(--critical); }
  .sheet p.text { font-size: 14px; color: var(--text-secondary); margin: 0 0 10px; }

  .msg { color: var(--text-secondary); }
  footer { margin-top: 16px; font-size: 12px; color: var(--text-muted); }
  @media (max-width: 420px) {
    .value { font-size: 28px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Commute delays</h1>
      <p id="route">&nbsp;</p>
    </div>
    <button class="icon-btn" id="gear" aria-label="Settings" title="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>
  <div id="sheet-root"></div>
  <div id="app"><p class="msg">Loading…</p></div>
  <footer id="foot"></footer>
</main>

<script>
// NMBS repeated-delay compensation: this many delays of at least this many minutes in the window below.
const COMP_NEEDED = 10;
const COMP_MIN_DELAY = 30;
const COMP_WINDOW_MONTHS = 6;
const COMP_COUNT_CANCELLED = true; // a cancelled train counts as a long delay

// Only these trip statuses count anywhere on the page ("skipped" = I didn't travel).
const COUNTED_STATUS = ["planned", "other"];
const CORRECTION_WINDOW_DAYS = 14;      // trips from the last 14 days, today and tomorrow can be corrected
const TZ = "Europe/Brussels";
const TOKEN_KEY = "commute.githubToken";
const CORRECTIONS_PATH = "data/corrections.csv";
const BRANCH = "main";

let CFG = null;
let TRIPS = [];                         // rows of data/trips.csv
let CORR = [];                          // rows of data/corrections.csv, in file order
let STATION = {};                       // station id -> display name, filled from config/route.json
const name = s => STATION[s] || s;

// GitHub Pages URL https://<owner>.github.io/<repo>/ tells us which repository to write to
const REPO = (() => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const repo = location.pathname.split("/")[1];
  return m && repo ? { owner: m[1], repo } : null;
})();

const storage = {
  get() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem(TOKEN_KEY, v); return true; } catch { return false; } },
  clear() { try { localStorage.removeItem(TOKEN_KEY); } catch {} },
};
let TOKEN = storage.get();
const canEdit = () => Boolean(TOKEN && REPO);

/* ---------- dates (always Belgian time) ---------- */
const isoToday = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const hhmm = unix => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }).format(new Date(unix * 1000));
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const WEEK = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const weekday = iso => WEEK[(new Date(iso + "T12:00:00Z").getUTCDay() + 6) % 7];
const isEditable = iso => iso >= addDays(isoToday(), -CORRECTION_WINDOW_DAYS) && iso <= addDays(isoToday(), 1);

/* ---------- CSV ---------- */
function parseCSV(text) {
  const [head, ...lines] = text.trim().split(/\r?\n/);
  const keys = head.split(",");
  return lines.filter(Boolean).map(line => {
    const vals = line.split(",");
    return Object.fromEntries(keys.map((k, i) => [k, vals[i] ?? ""]));
  });
}

function describeDays(days) {
  const key = WEEK.filter(d => days.includes(d)).join(",");
  if (key === "Mon,Tue,Wed,Thu,Fri") return "weekdays";
  if (key === WEEK.join(",")) return "every day";
  return WEEK.filter(d => days.includes(d)).join(", ");
}

function applyConfig(cfg) {
  CFG = cfg;
  const { home, work } = cfg.stations;
  STATION = { [home.id]: home.name, [work.id]: work.name };
  document.getElementById("route").textContent = `${home.name} ⇄ ${work.name} · ${describeDays(cfg.travel_days)}`;
}

/* ---------- trips with corrections applied ---------- */
function blankTrip(date, direction) {
  const { home, work } = CFG.stations;
  const [from, to] = direction === "out" ? [home.id, work.id] : [work.id, home.id];
  const usual = CFG.trains[direction];
  return { date, direction, train: usual.train, from_station: from, to_station: to, scheduled_departure: usual.departure,
           scheduled_arrival: "", delay_min: "", status: "planned", source: "auto", cancelled: "no" };
}

const hasResult = r => r.delay_min !== "" || r.cancelled === "yes";

// Same rules as track_commute.py, so a correction shows up immediately, before the evening run.
function applyCorrection(row, c) {
  if (!c) return row;
  const usual = CFG.trains[row.direction].train;
  if (c.status === "skipped") return { ...row, status: "skipped" };
  if (c.status === "other") {
    if (row.status === "other" && row.source === "manual" && row.train === c.train) return row;
    return { ...row, status: "other", source: "manual", train: c.train, scheduled_departure: c._departure || "",
             scheduled_arrival: "", delay_min: "", cancelled: "no" };
  }
  // planned = undo
  if (row.source === "auto" && row.status === "planned") return row;
  if (row.train === usual && hasResult(row)) return { ...row, status: "planned", source: "auto" };
  return { ...blankTrip(row.date, row.direction), scheduled_arrival: row.scheduled_arrival };
}

function latestCorrections() {
  const m = new Map();
  for (const c of CORR) m.set(`${c.date}|${c.direction}`, c);
  return m;
}

function buildTrips() {
  const latest = latestCorrections();
  const seen = new Set();
  const corrected = (r, c) => c ? { ...applyCorrection(r, c), corrected: true } : r;
  const out = TRIPS.map(r => { seen.add(`${r.date}|${r.direction}`); return corrected(r, latest.get(`${r.date}|${r.direction}`)); });
  // corrected trips the evening run hasn't logged yet (e.g. marked in advance)
  for (const [key, c] of latest) {
    if (!seen.has(key) && CFG.trains[c.direction] && c.status !== "planned") {
      out.push(corrected(blankTrip(c.date, c.direction), c));
      seen.add(key);
    }
  }
  // today's and tomorrow's trips, so they can be marked in advance
  const upcoming = [];
  if (canEdit()) {
    for (const date of [isoToday(), addDays(isoToday(), 1)]) {
      if (!CFG.travel_days.includes(weekday(date))) continue;
      for (const dir of Object.keys(CFG.trains)) {
        const key = `${date}|${dir}`;
        const existing = out.find(r => `${r.date}|${r.direction}` === key);
        if (existing && hasResult(existing)) continue;
        const r = existing || corrected(blankTrip(date, dir), latest.get(key));
        if (existing) out.splice(out.indexOf(existing), 1);
        upcoming.push({ ...r, upcoming: true });
      }
    }
  }
  const decorate = r => ({ ...r, delay: Number(r.delay_min), cancelled: r.cancelled === "yes", day: new Date(r.date + "T00:00:00"),
                           from: r.from_station, to: r.to_station, scheduled_time: r.scheduled_departure });
  return { all: out.map(decorate), upcoming: upcoming.map(decorate) };
}

/* ---------- rendering ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lateMin = r => r.cancelled ? 0 : Math.max(0, r.delay);   // being early doesn't cancel out delays
const fmtDate = d => d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const fmtAvg = n => (Math.round(n * 10) / 10).toLocaleString("en-GB", { minimumFractionDigits: 1 });
const counts = r => COUNTED_STATUS.includes(r.status) && (r.cancelled || r.delay_min !== "");

function status(r) {
  if (r.cancelled) return ["critical", "Cancelled"];
  if (r.delay >= COMP_MIN_DELAY) return ["critical", `+${r.delay} min`];
  if (r.delay >= 5) return ["warning", `+${r.delay} min`];
  if (r.delay > 0) return ["good", `+${r.delay} min`];
  return ["good", r.delay < 0 ? `${r.delay} min` : "On time"];
}

function delayCell(r) {
  if (r.status === "skipped") return `<span class="muted">Didn't travel</span>`;
  if (r.cancelled || r.delay_min !== "") {
    const [cls, text] = status(r);
    return `<span class="badge"><span class="dot ${cls}"></span>${text}</span>`;
  }
  if (r.status === "other") return `<span class="muted">Other train</span>`;
  return `<span class="muted">${r.upcoming ? "Upcoming" : "No data"}</span>`;
}

// extra line under the train for a trip that is still waiting for its delay
function pendingNote(r) {
  if (r.status === "skipped" || r.cancelled || r.delay_min !== "") return "";
  if (r.status !== "other" && r.upcoming) return "";
  const text = r.date >= isoToday() ? "delay follows after the evening run" : "no delay data (iRail only keeps today's)";
  return `<span class="pending">${r.status === "other" ? esc(r.train) + " · " : ""}${text}</span>`;
}

function tripRow(r) {
  const editable = canEdit() && isEditable(r.date) && CFG.trains[r.direction];
  const time = r.scheduled_time || r.train;
  return `<tr${editable ? ` class="editable" data-key="${esc(r.date)}|${esc(r.direction)}"` : ""}>
    <td>${fmtDate(r.day)}</td>
    <td>${esc(time)} <span class="hide-sm">${r.scheduled_time ? esc(r.train) : ""}</span>
      <span class="route">${esc(name(r.from))} → ${esc(name(r.to))}</span>${pendingNote(r)}</td>
    <td class="r">${delayCell(r)}</td>
  </tr>`;
}

let VIEW = { all: [], upcoming: [] };

function render() {
  VIEW = buildTrips();
  const rows = VIEW.all.filter(counts);
  const app = document.getElementById("app");
  if (!rows.length && !VIEW.upcoming.length) { app.innerHTML = '<p class="msg">No trips logged yet.</p>'; return; }

  const now = new Date();
  const monthRows = rows.filter(r => r.day.getFullYear() === now.getFullYear() && r.day.getMonth() === now.getMonth());
  const yearRows = rows.filter(r => r.day.getFullYear() === now.getFullYear());
  const sum = rs => rs.reduce((t, r) => t + lateMin(r), 0);

  // compensation window
  const since = new Date(now.getFullYear(), now.getMonth() - COMP_WINDOW_MONTHS, now.getDate());
  const qualifying = rows.filter(r => r.day >= since && (r.delay >= COMP_MIN_DELAY || (COMP_COUNT_CANCELLED && r.cancelled)));
  const compCount = qualifying.length;
  const nCancelled = qualifying.filter(r => r.cancelled).length;
  const reached = compCount >= COMP_NEEDED;

  // average per train (cancelled trips excluded from the average)
  const byTrain = new Map();
  for (const r of rows) {
    const t = byTrain.get(r.train) || { train: r.train, from: r.from, to: r.to, time: r.scheduled_time, ran: [], cancelled: 0 };
    r.cancelled ? t.cancelled++ : t.ran.push(r);
    byTrain.set(r.train, t);
  }
  const trains = [...byTrain.values()].map(t => ({
    ...t,
    avg: t.ran.length ? t.ran.reduce((s, r) => s + Math.max(0, r.delay), 0) / t.ran.length : 0,
    worst: t.ran.reduce((w, r) => (!w || r.delay > w.delay ? r : w), null),
  })).sort((a, b) => b.avg - a.avg);
  const maxAvg = Math.max(1, ...trains.map(t => t.avg));
  const worst = trains[0];

  // the list: counted trips, plus (for the owner) skipped ones and corrected trips still waiting for a delay
  const listed = VIEW.all.filter(r => counts(r) || r.status === "other" || (canEdit() && r.corrected));
  const byNewest = (a, b) => b.date.localeCompare(a.date) || (b.scheduled_time || "").localeCompare(a.scheduled_time || "");
  const last = listed.sort(byNewest).slice(0, 10);
  const upcoming = [...VIEW.upcoming].sort((a, b) => a.date.localeCompare(b.date) || (a.scheduled_time || "").localeCompare(b.scheduled_time || ""));
  const monthName = now.toLocaleDateString("en-GB", { month: "long" });

  app.innerHTML = `
  <div class="grid">
    <section class="card span-2">
      <p class="label">Repeated-delay compensation · last ${COMP_WINDOW_MONTHS} months</p>
      <div class="hero">${compCount}<span> / ${COMP_NEEDED}</span></div>
      <div class="meter" role="img" aria-label="${compCount} of ${COMP_NEEDED} delays needed">
        ${Array.from({ length: COMP_NEEDED }, (_, i) => `<i class="${i < compCount ? "on" : ""}"></i>`).join("")}
      </div>
      <div class="sub">${reached
        ? "Threshold reached — you can apply for compensation with NMBS."
        : `${COMP_NEEDED - compCount} more delay${COMP_NEEDED - compCount === 1 ? "" : "s"} of ${COMP_MIN_DELAY}+ min needed`}
        ${COMP_COUNT_CANCELLED && nCancelled ? ` · includes ${nCancelled} cancelled` : ""}</div>
    </section>

    <section class="card">
      <p class="label">Delay in ${monthName}</p>
      <div class="value">${sum(monthRows)}<small>min</small></div>
      <div class="sub">${monthRows.length} trip${monthRows.length === 1 ? "" : "s"}</div>
    </section>
    <section class="card">
      <p class="label">Delay in ${now.getFullYear()}</p>
      <div class="value">${sum(yearRows)}<small>min</small></div>
      <div class="sub">${yearRows.length} trip${yearRows.length === 1 ? "" : "s"}</div>
    </section>
    ${worst ? `
    <section class="card span-2">
      <p class="label">Worst train</p>
      <div class="value" style="font-size:26px">${esc(worst.train)} <small>${esc(worst.time)}</small></div>
      <div class="sub">${esc(name(worst.from))} → ${esc(name(worst.to))} · ${fmtAvg(worst.avg)} min late on average${
        worst.worst && worst.worst.delay > 0 ? ` · worst +${worst.worst.delay} min on ${fmtDate(worst.worst.day)}` : ""}${
        worst.cancelled ? ` · ${worst.cancelled}× cancelled` : ""}</div>
    </section>

    <section class="card span-2">
      <h2>Average delay per train</h2>
      <div class="rows">
        ${trains.map(t => `
          <div title="${esc(t.train)}: ${fmtAvg(t.avg)} min average over ${t.ran.length} trips${t.cancelled ? `, ${t.cancelled} cancelled` : ""}">
            <div class="row-head">
              <span><b>${esc(t.train)}</b> <span class="route">${esc(t.time)} ${esc(name(t.from))} → ${esc(name(t.to))}</span></span>
              <span class="num">${fmtAvg(t.avg)} min</span>
            </div>
            <div class="bar"><i style="width:${(t.avg / maxAvg) * 100}%"></i></div>
          </div>`).join("")}
      </div>
    </section>` : ""}

    <section class="card span-2">
      <h2>Last ${last.length} trips</h2>
      ${canEdit() ? `<p class="hint">Tap a trip to correct it.</p>` : ""}
      <table>
        <thead><tr><th>Date</th><th>Train</th><th class="r">Delay</th></tr></thead>
        <tbody>
          ${upcoming.length ? `<tr class="group"><td colspan="3">Upcoming</td></tr>${upcoming.map(tripRow).join("")}
            <tr class="group"><td colspan="3">Logged</td></tr>` : ""}
          ${last.map(tripRow).join("")}
        </tbody>
      </table>
    </section>
  </div>`;

  const lastLogged = rows.reduce((d, r) => (!d || r.day > d ? r.day : d), null);
  document.getElementById("foot").textContent =
    `${rows.length} trips logged${lastLogged ? ` · last update ${fmtDate(lastLogged)}` : ""} · delays measured on arrival`;
}

/* ---------- bottom sheets ---------- */
const sheetRoot = document.getElementById("sheet-root");
function openSheet(html) {
  sheetRoot.innerHTML = `<div class="backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  return sheetRoot.querySelector(".sheet");
}
function closeSheet() { sheetRoot.innerHTML = ""; }
sheetRoot.addEventListener("click", e => { if (e.target.matches("[data-close]")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function note(sheet, text, kind = "") {
  const n = sheet.querySelector(".note");
  n.className = `note ${kind}`;
  n.textContent = text;
}

function openTrip(key) {
  const r = [...VIEW.upcoming, ...VIEW.all].find(t => `${t.date}|${t.direction}` === key);
  if (!r) return;
  const usual = CFG.trains[r.direction];
  const state = r.status;
  const sheet = openSheet(`
    <h3>${fmtDate(r.day)} · ${esc(usual.departure)}</h3>
    <p class="sub">${esc(name(r.from))} → ${esc(name(r.to))}</p>
    <div class="opts">
      <button class="opt" data-pick="planned" aria-pressed="${state === "planned"}">As planned <small>${esc(usual.train)} ${esc(usual.departure)}</small></button>
      <button class="opt" data-pick="skipped" aria-pressed="${state === "skipped"}">Didn't travel <small>not counted</small></button>
      <button class="opt" data-pick="other" aria-pressed="${state === "other"}">Other train <small>${state === "other" ? esc(r.train) : "pick one"}</small></button>
    </div>
    <div id="other"></div>
    <p class="note" role="status"></p>
    <button class="link" data-close>Close</button>`);

  sheet.addEventListener("click", e => {
    const b = e.target.closest("[data-pick]");
    if (!b) return;
    if (b.dataset.pick === "other") return showOtherTrains(sheet, r);
    save(sheet, r, b.dataset.pick, "");
  });
}

async function fetchConnections(r) {
  const dep = toMin(CFG.trains[r.direction].departure);
  const start = Math.max(0, dep - 60), end = Math.min(24 * 60 - 1, dep + 120);
  const [y, m, d] = r.date.split("-");
  const found = new Map();
  let t = start;
  for (let page = 0; page < 8 && t <= end; page++) {
    const time = String(Math.floor(t / 60)).padStart(2, "0") + String(t % 60).padStart(2, "0");
    const url = `https://api.irail.be/v1/connections?from=${encodeURIComponent(r.from)}&to=${encodeURIComponent(r.to)}` +
                `&date=${d}${m}${y.slice(2)}&time=${time}&timesel=departure&format=json&lang=en&results=6`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`iRail ${res.status}`);
    const list = (await res.json()).connection || [];
    if (!list.length) break;
    let latest = t;
    for (const c of list) {
      const when = hhmm(Number(c.departure.time));
      latest = Math.max(latest, toMin(when));
      const direct = Number((c.vias && c.vias.number) || 0) === 0;
      if (direct && toMin(when) >= start && toMin(when) <= end) found.set(c.departure.vehicleinfo.shortname, when);
    }
    if (latest < t) break;
    t = latest + 1;
  }
  return [...found].map(([train, when]) => ({ train, when })).sort((a, b) => a.when.localeCompare(b.when));
}

function normaliseTrain(s) {
  const m = s.trim().toUpperCase().match(/^([A-Z]{1,3}\d?)\s*(\d{1,5})$/);
  return m ? `${m[1]} ${m[2]}` : null;
}

async function showOtherTrains(sheet, r) {
  const box = sheet.querySelector("#other");
  const typed = (msg) => {
    box.innerHTML = `<p class="text" style="margin-top:14px">${esc(msg)}</p>
      <div class="field"><input id="train-no" placeholder="e.g. IC 1234" autocapitalize="characters" autocomplete="off">
      <button class="btn" id="train-save">Save</button></div>`;
    const input = box.querySelector("#train-no");
    input.focus();
    const go = () => {
      const train = normaliseTrain(input.value);
      if (!train) return note(sheet, "Type a train number like IC 1234.", "err");
      save(sheet, r, "other", train);
    };
    box.querySelector("#train-save").addEventListener("click", go);
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  };
  box.innerHTML = `<p class="text" style="margin-top:14px">Loading trains…</p>`;
  let list;
  try { list = await fetchConnections(r); } catch (e) { list = null; }
  if (!list || !list.length) return typed(list ? "No direct trains found around that time. Type the train number:" :
                                                 "Couldn't load the trains from iRail. Type the train number:");
  box.innerHTML = `<p class="text" style="margin-top:14px">Direct trains ${esc(name(r.from))} → ${esc(name(r.to))}:</p>
    <div class="trains">${list.map(c => `<button class="opt" data-train="${esc(c.train)}" data-when="${esc(c.when)}">${esc(c.when)} · ${esc(c.train)}</button>`).join("")}</div>
    <button class="link" id="type-it">Not in the list? Type the train number</button>`;
  box.addEventListener("click", e => {
    const b = e.target.closest("[data-train]");
    if (b) save(sheet, r, "other", b.dataset.train, b.dataset.when);
    if (e.target.id === "type-it") typed("Type the train number:");
  });
}

/* ---------- GitHub storage ---------- */
const b64encode = s => { const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));

async function gh(method, body, token = TOKEN) {
  const url = `https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${CORRECTIONS_PATH}` + (method === "GET" ? `?ref=${BRANCH}` : "");
  const res = await fetch(url, {
    method, cache: "no-store",
    headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.ok) return res.json();
  const err = new Error(
    res.status === 401 ? "The token is invalid or has expired. Check it under Settings." :
    res.status === 403 ? "The token has no write access to this repository (Contents: Read and write needed)." :
    res.status === 404 ? "The token can't see this repository, or data/corrections.csv is missing." :
    res.status === 409 ? "conflict" : `GitHub error ${res.status}.`);
  err.status = res.status;
  throw err;
}

async function readCorrectionsFromGitHub() {
  const file = await gh("GET");
  return { text: b64decode(file.content), sha: file.sha };
}

async function appendCorrection(row) {
  const line = [row.date, row.direction, row.status, row.train, row.created_at].join(",");
  for (let attempt = 0; attempt < 2; attempt++) {
    const { text, sha } = await readCorrectionsFromGitHub();
    const next = (text.endsWith("\n") || !text ? text : text + "\n") + line + "\n";
    try {
      await gh("PUT", { message: `Correct trip ${row.date} ${row.direction}: ${row.status}${row.train ? " " + row.train : ""}`,
                        content: b64encode(next), sha, branch: BRANCH });
      return parseCSV(next);
    } catch (e) {
      if (e.status !== 409 || attempt === 1) throw e.status === 409 ? new Error("Someone else changed the file at the same time. Try again.") : e;
    }
  }
}

let saving = false;
async function save(sheet, r, status, train, departure = "") {
  if (saving) return;
  saving = true;
  sheet.querySelectorAll("button.opt, .btn").forEach(b => b.disabled = true);
  note(sheet, "Saving…");
  const row = { date: r.date, direction: r.direction, status, train: status === "other" ? train : "",
                created_at: new Date().toISOString().replace(/\.\d+Z$/, "Z") };
  try {
    CORR = await appendCorrection(row);
    if (status === "other") CORR[CORR.length - 1]._departure = departure;
    render();
    note(sheet, "Saved", "ok");
    setTimeout(closeSheet, 700);
  } catch (e) {
    note(sheet, e.message || "Couldn't save. Check your connection.", "err");
    sheet.querySelectorAll("button.opt, .btn").forEach(b => b.disabled = false);
  } finally {
    saving = false;
  }
}

/* ---------- settings ---------- */
function openSettings() {
  const sheet = openSheet(`
    <h3>Settings</h3>
    <p class="sub">Corrections are saved to GitHub with your own token.</p>
    ${!REPO ? `<p class="text">Corrections only work on the GitHub Pages site.</p>` : TOKEN ? `
      <p class="text">A token is stored in this browser only. Corrections are enabled for <b>${esc(REPO.owner)}/${esc(REPO.repo)}</b>.</p>
      <button class="btn secondary" id="remove">Remove token</button>` : `
      <p class="text">Paste a fine-grained GitHub token with access to <b>${esc(REPO.owner)}/${esc(REPO.repo)}</b> only (Contents: Read and write). It is stored in this browser only.</p>
      <div class="field"><input id="token" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn" id="store">Save</button></div>`}
    <p class="note" role="status"></p>
    <button class="link" data-close>Close</button>`);

  sheet.querySelector("#remove")?.addEventListener("click", () => {
    storage.clear();
    TOKEN = "";
    render();
    openSettings();
    note(sheetRoot.querySelector(".sheet"), "Token removed.", "ok");
  });
  sheet.querySelector("#store")?.addEventListener("click", async () => {
    const value = sheet.querySelector("#token").value.trim();
    if (!value) return note(sheet, "Paste a token first.", "err");
    note(sheet, "Checking the token…");
    try {
      const file = await gh("GET", null, value);
      if (!storage.set(value)) return note(sheet, "This browser doesn't allow storing the token (private mode?).", "err");
      TOKEN = value;
      CORR = parseCSV(b64decode(file.content));
      render();
      openSettings();
      note(sheetRoot.querySelector(".sheet"), "Token saved. Tap a trip to correct it.", "ok");
    } catch (e) {
      note(sheet, e.message || "Couldn't reach GitHub. Check your connection.", "err");
    }
  });
}

document.getElementById("gear").addEventListener("click", openSettings);
document.getElementById("app").addEventListener("click", e => {
  const tr = e.target.closest("tr.editable");
  if (tr && canEdit()) openTrip(tr.dataset.key);
});

/* ---------- load ---------- */
const load = (path, as) => fetch(path, { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(`${path}: ${r.status}`); return r[as](); });

// With a token, read corrections straight from GitHub (the Pages copy lags a minute behind a save).
const loadCorrections = () => (canEdit() ? readCorrectionsFromGitHub().then(f => f.text) : Promise.reject())
  .catch(() => load(CORRECTIONS_PATH, "text"))
  .catch(() => "date,direction,status,train,created_at\n");

Promise.all([load("config/route.json", "json"), load("data/trips.csv", "text"), loadCorrections()])
  .then(([cfg, trips, corrections]) => { applyConfig(cfg); TRIPS = parseCSV(trips); CORR = parseCSV(corrections); render(); })
  .catch(e => { document.getElementById("app").innerHTML = `<p class="msg">Could not load the data (${esc(e.message)}).</p>`; });
</script>
